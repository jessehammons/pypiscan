[project]
name = "pypiscan"
version = "0.0.0"
description = "Inventories compiled C libraries bundled inside PyPI wheels."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jesse Hammons" }]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pypiscan"]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-cov",
    "hypothesis",
    "pip-audit",
    "deptry",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "RUF", "S", "BLE", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"
strict = [
    "src/pypiscan/__init__.py",
    "src/pypiscan/__main__.py",
    "src/pypiscan/cli.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=pypiscan",
    "--cov-branch",
    "--cov-report=term-missing",
]
markers = [
    "network: tests that require network access (deselected in CI)",
]

[tool.coverage.run]
branch = true
source = ["pypiscan"]

[tool.coverage.report]
show_missing = true
fail_under = 84
