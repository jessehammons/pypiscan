[project]
name = "pypiscan"
version = "0.0.0"
description = "Scans PyPI packages for known CVE issues."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jesse Hammons" }]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pypiscan"]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-cov",
    "hypothesis",
    "pip-audit",
    "deptry",
]
